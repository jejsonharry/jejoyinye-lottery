name: Move countdown into forecast

on:
  push:
    paths:
      - 'scripts/move-countdown-into-forecast.py'
      - '.github/workflows/move-countdown-into-forecast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update forecast layout
        run: python scripts/move-countdown-into-forecast.py
      - name: Commit changes
        run: |
          if git diff --quiet -- predictions.html predictions-premium-v4.css; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.html predictions-premium-v4.css
          git commit -m "ui: replace forecast heading with live countdown"
          git push
