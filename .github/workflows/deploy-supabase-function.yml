name: Deploy Supabase Results Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/sync-modern-results/**"
      - "supabase/functions/admin-delete/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-modern-results --project-ref iedgznzmmfkdhgmkghwt
          supabase functions deploy admin-delete --project-ref iedgznzmmfkdhgmkghwt
