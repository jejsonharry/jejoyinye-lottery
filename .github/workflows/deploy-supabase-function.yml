name: Deploy Supabase Results Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/sync-modern-results/**"
      - "supabase/functions/admin-delete/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply prediction audit schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -n --rawfile query supabase/migrations/20260908_prediction_audit.sql \
            '{query: $query, read_only: false}' > /tmp/prediction-schema.json
          curl --fail-with-body --request POST \
            "https://api.supabase.com/v1/projects/iedgznzmmfkdhgmkghwt/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/prediction-schema.json

      - name: Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-modern-results --project-ref iedgznzmmfkdhgmkghwt
          supabase functions deploy admin-delete --project-ref iedgznzmmfkdhgmkghwt
