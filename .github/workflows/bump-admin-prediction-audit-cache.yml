name: Bump Admin Prediction Audit Cache

on:
  push:
    paths:
      - ".github/workflows/bump-admin-prediction-audit-cache.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cache bump
        run: python scripts/bump_admin_prediction_audit_cache.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "fix: refresh admin prediction audit assets"
          git push
