name: Backtest Modern Evidence Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest-modern-evidence-engine.mjs'
      - '.github/workflows/backtest-modern-evidence-engine.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run walk-forward backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backtest-modern-evidence-engine.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: modern-evidence-engine-backtest
          path: reports/modern-evidence-engine-backtest.*
