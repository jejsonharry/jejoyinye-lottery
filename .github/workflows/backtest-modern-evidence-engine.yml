name: Backtest Modern Evidence Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest-modern-evidence-engine.mjs'
      - 'scripts/run-modern-evidence-backtest-clean.mjs'
      - '.github/workflows/backtest-modern-evidence-engine.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run clean walk-forward backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-modern-evidence-backtest-clean.mjs
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/modern-evidence-engine-backtest.json reports/modern-evidence-engine-backtest.md
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "analysis: update Modern evidence-engine backtest report"
            git push origin main
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: modern-evidence-engine-backtest
          path: reports/modern-evidence-engine-backtest.*
