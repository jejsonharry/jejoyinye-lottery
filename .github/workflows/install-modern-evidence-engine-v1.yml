name: Install Modern Evidence Fusion v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modern-evidence-engine-core.js'
      - 'scripts/install-modern-evidence-engine-v1.py'
      - '.github/workflows/install-modern-evidence-engine-v1.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Evidence Fusion engine
        run: python scripts/install-modern-evidence-engine-v1.py
      - name: Commit active engine changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.js predictions.html
          git commit -m "feat: activate Modern Evidence Fusion v1"
          git push origin main
