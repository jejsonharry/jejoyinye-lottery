name: Attach Admin Prediction Audit

on:
  push:
    paths:
      - ".github/workflows/attach-admin-prediction-audit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply audit assets
        run: python scripts/attach_admin_prediction_audit.py

      - name: Validate audit includes
        run: |
          grep -q 'admin-prediction-audit-v1.css?v=1' admin.html
          grep -q 'admin-prediction-audit-v1.js?v=1' admin.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ui: add prediction performance audit to admin analytics"
            git push origin main
          fi
