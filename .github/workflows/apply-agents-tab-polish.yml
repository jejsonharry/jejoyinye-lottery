name: Apply agents tab polish

on:
  push:
    paths:
      - 'scripts/polish_agents_tab.py'
      - '.github/workflows/apply-agents-tab-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply agents tab update
        run: python scripts/polish_agents_tab.py
      - name: Commit applied changes
        run: |
          if git diff --quiet -- admin.html admin.js admin-premium-v3.css; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin.js admin-premium-v3.css
          git commit -m "ui: polish agent management and remove view website button"
          git push
