name: Revamp admin dashboard shell

on:
  push:
    paths:
      - 'scripts/revamp_admin_shell.py'
      - '.github/workflows/revamp-admin-dashboard-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revamp admin dashboard shell
        run: python scripts/revamp_admin_shell.py
      - name: Commit admin dashboard revamp
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "ui: create dedicated admin control center shell"
          git push
