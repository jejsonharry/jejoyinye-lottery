name: Revamp admin dashboard shell

on:
  push:
    paths:
      - '.github/workflows/revamp-admin-dashboard-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revamp admin dashboard shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')

          # Give the admin page its own visual context.
          text = text.replace('<body>', '<body class="admin-dashboard-body">', 1)

          # Replace the public website header/navigation with a dedicated admin shell.
          body_shell_pattern = re.compile(
              r'<!-- =====================================================\s*HEADER\s*===================================================== -->.*?'
              r'<!-- =====================================================\s*ADMIN PAGE\s*===================================================== -->',
              re.S,
          )

          admin_shell = '''<!-- =====================================================
     ADMIN CONTROL HEADER
===================================================== -->

<header class="admin-control-header">
    <div class="admin-control-header-inner">
        <a href="/" class="admin-control-brand" aria-label="Open JOLS website">
            <img src="Images/jols-logo.png" alt="JOLS" class="admin-control-logo">
            <span class="admin-control-brand-copy">
                <small>JOLS SECURE ADMIN</small>
                <strong>Control Center</strong>
            </span>
        </a>

        <div class="admin-control-actions">
            <a href="/" class="admin-view-site-btn">View Website</a>
            <button type="button" id="logout-btn" class="admin-header-logout">Logout</button>
        </div>
    </div>
</header>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->'''

          text, shell_count = body_shell_pattern.subn(admin_shell, text, count=1)
          if shell_count != 1:
              raise SystemExit('Could not replace the public admin header/navigation block.')

          # Replace the old large heading (and its duplicate Logout button) with a compact dashboard intro.
          heading_pattern = re.compile(
              r'\s*<!-- ADMIN HEADING -->.*?'
              r'<!-- =================================================\s*TAB NAVIGATION\s*================================================= -->',
              re.S,
          )

          compact_heading = '''

    <!-- ADMIN HEADING -->
    <section class="admin-top admin-top-compact">
        <div>
            <span class="admin-eyebrow">ADMINISTRATION</span>
            <h2>Administrator Dashboard</h2>
            <p>Manage results, agents, analytics and customer enquiries from one secure workspace.</p>
        </div>
        <span class="admin-session-badge" aria-label="Secure administrator session">Secure session</span>
    </section>


    <!-- =================================================
         TAB NAVIGATION
    ================================================= -->'''

          text, heading_count = heading_pattern.subn(compact_heading, text, count=1)
          if heading_count != 1:
              raise SystemExit('Could not replace the admin heading block.')

          # Shorter tab label makes the mobile control strip cleaner.
          text = text.replace(
              'Messages / Enquiries\n            <span id="admin-unread-tab-count"',
              'Messages\n            <span id="admin-unread-tab-count"',
              1,
          )

          admin_css = r'''
<style id="admin-shell-revamp">
/* =========================================================
   JOLS ADMIN CONTROL SHELL — MOBILE + DESKTOP
========================================================= */
.admin-dashboard-body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 0%, rgba(37, 99, 235, 0.08), transparent 28rem),
        #f4f7fb;
}

.admin-control-header {
    position: sticky;
    top: 0;
    z-index: 3000;
    background:
        linear-gradient(135deg, #081426 0%, #102b4f 55%, #123f66 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 10px 30px rgba(2, 8, 23, 0.18);
}

.admin-control-header-inner {
    width: min(1250px, 94%);
    min-height: 76px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
}

.admin-control-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: #ffffff;
    text-decoration: none;
    min-width: 0;
}

.admin-control-logo {
    width: 48px;
    height: 48px;
    object-fit: contain;
    flex: 0 0 auto;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.24));
}

.admin-control-brand-copy {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.admin-control-brand-copy small {
    color: #93c5fd;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.45px;
}

.admin-control-brand-copy strong {
    margin-top: 2px;
    color: #ffffff;
    font-size: 19px;
    line-height: 1.15;
    letter-spacing: -0.2px;
}

.admin-control-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
}

.admin-view-site-btn,
.admin-header-logout {
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 900;
    text-decoration: none;
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}

.admin-view-site-btn {
    color: #e0f2fe;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.18);
}

.admin-header-logout {
    color: #ffffff;
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 7px 16px rgba(185, 28, 28, 0.24);
}

.admin-view-site-btn:hover,
.admin-header-logout:hover {
    transform: translateY(-1px);
}

.admin-dashboard-body .admin-page {
    width: min(1250px, 94%);
    margin: 22px auto 64px;
}

.admin-dashboard-body .admin-top-compact {
    margin-bottom: 16px;
    padding: 20px 22px;
    border-radius: 18px;
    background: linear-gradient(145deg, #ffffff, #f8fbff);
    border: 1px solid #dbe5f0;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.055);
}

.admin-dashboard-body .admin-top-compact h2 {
    margin: 4px 0 5px;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.6px;
}

.admin-dashboard-body .admin-top-compact p {
    max-width: 760px;
    line-height: 1.55;
}

.admin-session-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 999px;
    background: #dcfce7;
    color: #166534;
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
}

.admin-session-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.13);
}

.admin-dashboard-body .admin-tabs {
    top: 88px;
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    margin-bottom: 18px;
    padding: 7px !important;
    border: 1px solid #dbe5f0 !important;
    background: rgba(255, 255, 255, 0.96) !important;
    box-shadow: 0 9px 25px rgba(15, 23, 42, 0.07);
}

.admin-dashboard-body .admin-tab-button {
    min-width: 0;
    min-height: 42px;
    padding: 10px 9px !important;
    font-size: 12px !important;
}

.admin-dashboard-body .admin-tab-button.active {
    background: linear-gradient(135deg, #173d74, #2563eb) !important;
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20) !important;
}

.admin-dashboard-body .admin-stats {
    gap: 12px;
    margin-bottom: 18px;
}

.admin-dashboard-body .admin-stat-card {
    padding: 18px;
    border-radius: 16px;
    border-color: #dde6ef;
}

.admin-dashboard-body .admin-stat-card strong {
    font-size: 27px;
}

.admin-dashboard-body .dashboard-welcome {
    border-radius: 19px;
    padding: 28px;
    background: linear-gradient(135deg, #0a1930, #123d60 58%, #0f766e);
}

@media (max-width: 760px) {
    .admin-control-header-inner {
        width: 94%;
        min-height: 68px;
    }

    .admin-control-logo {
        width: 41px;
        height: 41px;
    }

    .admin-control-brand-copy small {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .admin-control-brand-copy strong {
        font-size: 16px;
    }

    .admin-view-site-btn,
    .admin-header-logout {
        min-height: 36px;
        padding: 8px 10px;
        font-size: 11px;
    }

    .admin-dashboard-body .admin-page {
        width: 94%;
        margin-top: 14px;
    }

    .admin-dashboard-body .admin-top-compact {
        padding: 17px;
        margin-bottom: 12px;
        align-items: flex-start;
    }

    .admin-dashboard-body .admin-top-compact h2 {
        font-size: 25px;
    }

    .admin-dashboard-body .admin-tabs {
        position: sticky;
        top: 76px;
        display: flex !important;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: none;
        gap: 6px !important;
        padding: 6px !important;
    }

    .admin-dashboard-body .admin-tabs::-webkit-scrollbar {
        display: none;
    }

    .admin-dashboard-body .admin-tab-button {
        flex: 0 0 auto;
        min-width: 105px;
        min-height: 40px;
        white-space: nowrap;
        font-size: 11px !important;
    }

    .admin-dashboard-body .admin-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px;
    }

    .admin-dashboard-body .admin-stat-card {
        min-width: 0;
        padding: 15px;
    }

    .admin-dashboard-body .admin-stat-card span {
        font-size: 10px;
        line-height: 1.35;
    }

    .admin-dashboard-body .admin-stat-card strong {
        font-size: 25px;
    }

    .admin-dashboard-body .admin-stat-card:last-child {
        grid-column: 1 / -1;
    }

    .admin-dashboard-body .dashboard-welcome {
        padding: 21px;
        margin-bottom: 18px;
    }

    .admin-dashboard-body .dashboard-welcome h2 {
        font-size: 26px;
    }

    .admin-dashboard-body .dashboard-shortcuts {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 18px;
    }

    .admin-dashboard-body .dashboard-shortcut {
        padding: 17px;
    }
}

@media (max-width: 480px) {
    .admin-control-brand-copy small {
        display: none;
    }

    .admin-control-brand-copy strong {
        font-size: 15px;
    }

    .admin-view-site-btn {
        font-size: 0;
        width: 38px;
        padding: 0;
    }

    .admin-view-site-btn::before {
        content: "Site";
        font-size: 10px;
    }

    .admin-header-logout {
        padding-inline: 10px;
    }

    .admin-session-badge {
        padding: 7px 9px;
        font-size: 10px;
    }
}
</style>
'''

          if 'id="admin-shell-revamp"' not in text:
              text = text.replace('</head>', admin_css + '\n</head>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit admin dashboard revamp
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "ui: create dedicated admin control center shell"
          git push
