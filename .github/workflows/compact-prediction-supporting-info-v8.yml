name: Compact prediction supporting information

on:
  push:
    paths:
      - 'scripts/compact-prediction-supporting-info-v8.py'
      - '.github/workflows/compact-prediction-supporting-info-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact supporting information layout
        run: python scripts/compact-prediction-supporting-info-v8.py
      - name: Commit changes
        run: |
          if git diff --quiet -- predictions-premium-v4.css predictions.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions-premium-v4.css predictions.html
          git commit -m "ui: compact prediction supporting information"
          git push
