name: Apply Modern 60-30-10 refinement

on:
  push:
    paths:
      - '.github/workflows/apply-modern-60-30-10-refinement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Modern prediction engine
        run: python scripts/refine_modern_fixed_60_30_10.py
      - name: Validate strict method
        run: |
          grep -q 'statistical: 0.60' predictions.js
          grep -q 'classification: 0.30' predictions.js
          grep -q 'moving: 0.10' predictions.js
          grep -q 'const selectedCandidates = rankedNumbers.slice(0, 5);' predictions.js
          grep -q 'MODERN_RANGE_PREDICTION_ENGINE_LABEL' predictions.js
      - name: Commit engine refinement
        run: |
          if git diff --quiet -- predictions.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.js
          git commit -m "engine: refine strict Modern 60-30-10 scoring"
          git push
