name: Apply Public Premium Texture

on:
  push:
    paths:
      - "scripts/apply-public-premium-texture.py"
      - "public-premium-texture-v1.css"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared public texture
        run: python3 scripts/apply-public-premium-texture.py
      - name: Verify stylesheet links
        run: |
          for f in index.html results.html predictions.html play-online.html agent.html contact.html; do
            grep -q 'public-premium-texture-v1.css?v=1' "$f"
          done
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: apply rich premium texture across public site"
          git push
