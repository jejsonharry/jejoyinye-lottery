name: Restore Ghana homepage machine numbers

on:
  push:
    paths:
      - '.github/workflows/restore-ghana-machine-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Ghana machine numbers on homepage
        run: python scripts/restore_ghana_machine_homepage.py
      - name: Commit changes
        run: |
          if git diff --quiet -- script.js index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git commit -m "fix: show Ghana machine numbers on homepage"
          git push
