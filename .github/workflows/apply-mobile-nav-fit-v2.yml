name: Apply mobile nav fit v2

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-nav-fit-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile nav fit
        run: python scripts/apply_mobile_nav_fit_v2.py
      - name: Validate public pages
        run: |
          for f in index.html results.html predictions.html play-online.html agent.html contact.html; do
            grep -q 'public-nav-mobile-fit-v2.css?v=1' "$f"
          done
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html results.html predictions.html play-online.html agent.html contact.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: fit all public tabs on mobile without scrolling"
          git push
