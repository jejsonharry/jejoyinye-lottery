name: Tune Evidence Fusion v1.1

on:
  push:
    paths:
      - ".github/workflows/tune-evidence-fusion-v1-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply validated EF-D tuning
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('modern-evidence-engine-core.js')
          js_path = Path('predictions.js')
          html_path = Path('predictions.html')

          core = core_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          core = core.replace('id: "evidence-fusion-v1-ef-f"', 'id: "evidence-fusion-v1.1-ef-d"', 1)
          core = core.replace('label: "Evidence Fusion v1"', 'label: "Evidence Fusion v1.1"', 1)
          core = core.replace('''sameGame: 0.45,\n            machineConversion: 0.20,\n            crossConfirmation: 0.20,\n            classification: 0.10,\n            moving: 0.05''', '''sameGame: 0.50,\n            machineConversion: 0.15,\n            crossConfirmation: 0.15,\n            classification: 0.10,\n            moving: 0.10''', 1)

          js = js.replace('Evidence Fusion v1 • EF-F', 'Evidence Fusion v1.1 • EF-D')
          js = js.replace('Evidence Fusion v1 • Custom Range', 'Evidence Fusion v1.1 • Custom Range')

          html = html.replace(
              '45% Same-Game • 20% Machine→Winning • 20% Cross-Confirmation • 10% Classification • 5% Moving',
              '50% Same-Game • 15% Machine→Winning • 15% Cross-Confirmation • 10% Classification • 10% Moving',
              1
          )
          html = html.replace('src="modern-evidence-engine-core.js?v=1"', 'src="modern-evidence-engine-core.js?v=2"', 1)
          html = html.replace('src="predictions.js?v=39"', 'src="predictions.js?v=40"', 1)

          checks = [
              ('evidence-fusion-v1.1-ef-d', core),
              ('sameGame: 0.50', core),
              ('machineConversion: 0.15', core),
              ('crossConfirmation: 0.15', core),
              ('moving: 0.10', core),
              ('50% Same-Game', html),
              ('modern-evidence-engine-core.js?v=2', html),
          ]
          for needle, text in checks:
              if needle not in text:
                  raise SystemExit(f'Missing expected tuned value: {needle}')

          core_path.write_text(core, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check modern-evidence-engine-core.js
          node --check predictions.js

      - name: Commit tuned engine
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-evidence-engine-core.js predictions.js predictions.html
          git commit -m "feat: tune Evidence Fusion v1.1 to validated EF-D profile"
          git push
