name: Enable predictions premium v4

on:
  push:
    paths:
      - 'scripts/enable-predictions-premium-v4.py'
      - '.github/workflows/enable-predictions-premium-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable predictions premium layer
        run: python scripts/enable-predictions-premium-v4.py
      - name: Validate stylesheet link
        run: grep -q 'predictions-premium-v4.css?v=1' predictions.html
      - name: Commit change
        run: |
          if git diff --quiet -- predictions.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.html
          git commit -m "ui: enable premium predictions presentation"
          git push
