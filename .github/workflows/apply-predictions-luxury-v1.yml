name: Apply Predictions Luxury V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-predictions-luxury-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach luxury predictions stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('predictions.html')
          s = p.read_text()
          link = '    <link rel="stylesheet" href="predictions-luxury-v1.css?v=1">\n'
          if 'predictions-luxury-v1.css' not in s:
              s = s.replace('</head>', link + '</head>')
              p.write_text(s)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "design: enable luxury predictions theme"
            git push
          fi
