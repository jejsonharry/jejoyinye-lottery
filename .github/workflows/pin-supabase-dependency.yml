name: Pin Supabase browser dependency

on:
  push:
    paths:
      - 'scripts/pin_supabase_dependency.py'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin Supabase JS in HTML files
        run: python3 scripts/pin_supabase_dependency.py

      - name: Commit pinned dependency
        run: |
          if git diff --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "security: pin Supabase browser dependency to 2.116.0"
          git push
