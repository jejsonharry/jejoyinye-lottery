name: Remove Legacy Prediction Engines

on:
  push:
    paths:
      - ".github/workflows/remove-legacy-prediction-engines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove legacy prediction code and files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('predictions.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '// =========================================================\n// LEGACY MODERN SCORER\n// Retained only as an inactive comparison/archive. Live Modern forecasts use Evidence Fusion v1.\n// =========================================================',
              '// =========================================================\n// MODERN EVIDENCE INPUT TABLES\n// Classification and moving-number relationships used by Evidence Fusion v1.\n// ========================================================='
          )

          legacy_constants = '''const MODERN_PREDICTION_WEIGHTS = Object.freeze({\n    statistical: 0.60,\n    classification: 0.30,\n    moving: 0.10\n});\n\n'''
          text = text.replace(legacy_constants, '', 1)

          legacy_refinement = '''// Legacy R1 constants below are retained for historical comparison only.\n// They are no longer used by the active Modern Billionaire prediction path.\nconst MODERN_RECENT_SAME_GAME_BOOSTS = Object.freeze([1.45, 1.30, 1.15]);\nconst MODERN_TODAY_CONTEXT_BUDGET = Object.freeze({\n    statisticalWinning: 1.20,\n    statisticalMachine: 0.36,\n    relationship: 0.90\n});\n\n'''
          text = text.replace(legacy_refinement, '', 1)

          scorer_start = text.find('function addModernRelationshipScores(')
          active_marker = '// =========================================================\n// MODERN BILLIONAIRE — EVIDENCE FUSION v1 (ACTIVE)'
          scorer_end = text.find(active_marker)
          if scorer_start == -1 or scorer_end == -1 or scorer_end <= scorer_start:
              raise SystemExit('Legacy Modern scorer block markers not found')
          text = text[:scorer_start] + text[scorer_end:]

          v22_start_marker = '// =========================================================\n// INACTIVE V2.2 SAVED-SNAPSHOT ARCHIVE'
          display_marker = '// =========================================================\n// DISPLAY NEXT GAME\n// ========================================================='
          v22_start = text.find(v22_start_marker)
          v22_end = text.find(display_marker)
          if v22_start == -1 or v22_end == -1 or v22_end <= v22_start:
              raise SystemExit('V2.2 archive block markers not found')
          text = text[:v22_start] + text[v22_end:]

          forbidden = [
              'INACTIVE V2.2',
              'calculateCustomRangeV2Prediction',
              'calculateDateRangeConsensusPrediction',
              'calculateStatisticalPrediction',
              'applyModernClassificationRanking',
              'MODERN_PREDICTION_WEIGHTS',
              'MODERN_RECENT_SAME_GAME_BOOSTS',
              'MODERN_TODAY_CONTEXT_BUDGET'
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit(f'Legacy prediction references remain: {leftovers}')

          if 'calculateModernEvidenceFusionPrediction(' not in text:
              raise SystemExit('Active Evidence Fusion adapter missing after cleanup')
          if 'MODERN_CLASSIFICATION_CHART' not in text or 'MODERN_MOVING_GRAPH' not in text:
              raise SystemExit('Evidence Fusion input tables missing after cleanup')
          if 'calculateGhanaGamePatternPrediction(' not in text:
              raise SystemExit('Ghana prediction engine missing after cleanup')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f \
            scripts/refine_modern_fixed_60_30_10.py \
            scripts/snapshot-modern-prediction.mjs \
            scripts/generate-prediction-snapshots.mjs \
            .github/workflows/apply-modern-60-30-10-refinement.yml

      - name: Verify active engine remains intact
        run: |
          grep -q "MODERN BILLIONAIRE — EVIDENCE FUSION v1 (ACTIVE)" predictions.js
          grep -q "calculateModernEvidenceFusionPrediction" predictions.js
          grep -q "modern-evidence-engine-core.js" predictions.html
          grep -q "snapshot-modern-evidence-prediction.mjs" .github/workflows/import-modern-results.yml
          ! grep -q "INACTIVE V2.2" predictions.js
          ! grep -q "calculateStatisticalPrediction" predictions.js
          ! test -e scripts/refine_modern_fixed_60_30_10.py
          ! test -e scripts/snapshot-modern-prediction.mjs
          ! test -e scripts/generate-prediction-snapshots.mjs

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No legacy engine cleanup was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cleanup: remove legacy prediction engines and v2.2"
          git push
