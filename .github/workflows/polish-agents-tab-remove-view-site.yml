name: Refresh three-tab mobile navigation

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-three-tab-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump three-tab mobile navigation stylesheet on all public pages
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = ['index.html','results.html','predictions.html','play-online.html','agent.html','contact.html']
          for filename in pages:
              path = Path(filename)
              html = path.read_text(encoding='utf-8')
              html = re.sub(
                  r'public-mobile-nav-final-v11\.css\?v=\d+',
                  'public-mobile-nav-final-v11.css?v=13',
                  html,
              )
              if 'public-mobile-nav-final-v11.css?v=13' not in html:
                  raise SystemExit(f'Three-tab navigation stylesheet missing in {filename}')
              path.write_text(html, encoding='utf-8')

      - name: Commit three-tab navigation refresh
        shell: bash
        run: |
          if git diff --quiet -- index.html results.html predictions.html play-online.html agent.html contact.html; then
            echo "No navigation references changed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: show only Home Results Predictions in mobile navigation"
          git push
