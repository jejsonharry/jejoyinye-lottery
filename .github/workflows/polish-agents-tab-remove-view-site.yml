name: Keep homepage result cards side by side on mobile

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile two-column latest-results layout
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('homepage-enhancements-v3.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'HOMEPAGE MOBILE RESULTS — SIDE BY SIDE V4'
          if marker not in css:
              css += '''\n\n/* =========================================================\n   HOMEPAGE MOBILE RESULTS — SIDE BY SIDE V4\n========================================================= */\n@media (max-width: 700px) {\n    #home-results-container {\n        display: grid !important;\n        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;\n        gap: 10px !important;\n        align-items: stretch !important;\n    }\n\n    #home-results-container .home-result-card {\n        min-width: 0 !important;\n        height: 100% !important;\n        margin: 0 !important;\n        padding: 12px 10px !important;\n        border-radius: 14px !important;\n        box-sizing: border-box !important;\n    }\n\n    #home-results-container .home-result-heading {\n        align-items: flex-start !important;\n        gap: 5px !important;\n    }\n\n    #home-results-container .home-result-heading h3 {\n        font-size: 13px !important;\n        line-height: 1.15 !important;\n        overflow-wrap: anywhere !important;\n    }\n\n    #home-results-container .home-result-heading span {\n        font-size: 9px !important;\n        line-height: 1.2 !important;\n    }\n\n    #home-results-container .home-result-share-btn {\n        flex: 0 0 auto !important;\n        min-width: 30px !important;\n        min-height: 30px !important;\n        padding: 5px 7px !important;\n        font-size: 9px !important;\n    }\n\n    #home-results-container .home-number-section {\n        margin-top: 10px !important;\n    }\n\n    #home-results-container .home-number-section h4 {\n        margin: 0 0 6px !important;\n        font-size: 9px !important;\n        line-height: 1.2 !important;\n    }\n\n    #home-results-container .winning-numbers,\n    #home-results-container .machine-numbers {\n        display: flex !important;\n        flex-wrap: wrap !important;\n        gap: 4px !important;\n    }\n\n    #home-results-container .number-ball {\n        width: 26px !important;\n        height: 26px !important;\n        min-width: 26px !important;\n        font-size: 10px !important;\n        line-height: 26px !important;\n        box-shadow: 0 2px 5px rgba(0,0,0,.14) !important;\n    }\n\n    #home-results-container .home-result-player-actions {\n        gap: 5px !important;\n        margin-top: 10px !important;\n    }\n\n    #home-results-container .home-result-player-actions a,\n    #home-results-container .home-result-player-actions button {\n        min-height: 30px !important;\n        padding: 6px 7px !important;\n        font-size: 8px !important;\n    }\n}\n\n@media (max-width: 380px) {\n    #home-results-container {\n        gap: 7px !important;\n    }\n\n    #home-results-container .home-result-card {\n        padding: 10px 8px !important;\n    }\n\n    #home-results-container .number-ball {\n        width: 23px !important;\n        height: 23px !important;\n        min-width: 23px !important;\n        font-size: 9px !important;\n        line-height: 23px !important;\n    }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('homepage-enhancements-v3.css?v=2', 'homepage-enhancements-v3.css?v=4')
          html = html.replace('homepage-enhancements-v3.css?v=3', 'homepage-enhancements-v3.css?v=4')
          index_path.write_text(html, encoding='utf-8')

      - name: Commit homepage mobile result layout
        shell: bash
        run: |
          if git diff --quiet -- homepage-enhancements-v3.css index.html; then
            echo "No homepage changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-enhancements-v3.css index.html
          git commit -m "ui: show Modern and Ghana homepage results side by side on mobile"
          git push
