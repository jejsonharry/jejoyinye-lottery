name: Force fresh larger mobile navigation

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump mobile navigation stylesheet cache version
        shell: python
        run: |
          from pathlib import Path
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('public-nav-mobile-fit-v2.css?v=1', 'public-nav-mobile-fit-v2.css?v=3')
              new = new.replace('public-nav-mobile-fit-v2.css?v=2', 'public-nav-mobile-fit-v2.css?v=3')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)
          if not changed:
              raise SystemExit('No HTML pages referenced the mobile navigation stylesheet.')
          print('Updated:', ', '.join(changed))

      - name: Commit cache-bust update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "ui: load larger mobile navigation on public pages"
          git push
