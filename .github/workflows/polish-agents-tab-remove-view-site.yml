name: Load Results mobile premium styling last

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-results-mobile-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Results page mobile override after global nav CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('results.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(
              r'\s*<link\s+rel="stylesheet"\s+href="results-mobile-premium-v1\.css(?:\?v=\d+)?"\s*>',
              '',
              html,
              flags=re.I,
          )

          global_link = '<link rel="stylesheet" href="public-nav-mobile-fit-v2.css?v=5">'
          if global_link not in html:
              raise SystemExit('Global mobile navigation stylesheet link not found in results.html')

          html = html.replace(
              global_link,
              global_link + '\n    <link rel="stylesheet" href="results-mobile-premium-v1.css?v=1">',
              1,
          )

          if html.find('results-mobile-premium-v1.css?v=1') < html.find(global_link):
              raise SystemExit('Results mobile override is not loading after global nav CSS')

          path.write_text(html, encoding='utf-8')

      - name: Commit Results page mobile polish
        shell: bash
        run: |
          if git diff --quiet -- results.html; then
            echo "No Results page changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.html
          git commit -m "ui: apply premium mobile layout to Results page"
          git push
