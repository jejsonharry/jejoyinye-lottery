name: Make homepage mobile navigation sticky

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sticky-home-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep homepage mobile navigation visible while scrolling
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('homepage-enhancements-v3.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'HOMEPAGE MOBILE NAVIGATION — STICKY V6'

          if marker not in css:
              css += '''\n\n/* =========================================================\n   HOMEPAGE MOBILE NAVIGATION — STICKY V6\n========================================================= */\n@media (max-width: 700px) {\n    body .premium-nav {\n        position: -webkit-sticky !important;\n        position: sticky !important;\n        top: 0 !important;\n        z-index: 2147483000 !important;\n        width: 100% !important;\n        isolation: isolate !important;\n        box-shadow: 0 10px 26px rgba(2, 8, 23, .22) !important;\n    }\n\n    body .premium-nav::before {\n        content: "";\n        position: absolute;\n        inset: 0;\n        z-index: -1;\n        background: linear-gradient(180deg, rgba(8,24,43,.98) 0%, rgba(6,19,34,.98) 100%);\n        backdrop-filter: blur(12px);\n        -webkit-backdrop-filter: blur(12px);\n    }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          for version in ('5', '4', '3', '2'):
              html = html.replace(
                  f'homepage-enhancements-v3.css?v={version}',
                  'homepage-enhancements-v3.css?v=6'
              )
          index_path.write_text(html, encoding='utf-8')

      - name: Commit sticky homepage navigation
        shell: bash
        run: |
          if git diff --quiet -- homepage-enhancements-v3.css index.html; then
            echo "No homepage changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-enhancements-v3.css index.html
          git commit -m "ui: keep homepage mobile navigation visible while scrolling"
          git push
