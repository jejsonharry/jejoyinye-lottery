name: Polish agents tab and remove view website

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade agents tab and admin header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('admin.html')
          js_path = Path('admin.js')
          css_path = Path('admin-premium-v3.css')

          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          # -----------------------------------------------------
          # HEADER: remove View Website button only.
          # -----------------------------------------------------
          html = re.sub(
              r'\s*<a href="/" class="admin-view-site-btn">\s*View Website\s*</a>',
              '',
              html,
              count=1,
              flags=re.S,
          )

          # -----------------------------------------------------
          # AGENT TAB: stronger title and operational description.
          # -----------------------------------------------------
          html = html.replace(
              '<h2>\n                    Agent Applications\n                </h2>',
              '<h2>\n                    Agent Applications &amp; Onboarding\n                </h2>',
              1,
          )
          html = html.replace(
              '<p>\n                    Review applications, verify applicant information, manage approval decisions and track onboarding progress across the agent network.\n                </p>',
              '<p>\n                    Review applications, verify applicant information, manage approval decisions and track onboarding progress across the agent network.\n                </p>',
              1,
          )
          # Handle the older wording if still present.
          html = re.sub(
              r'<p>\s*Review and manage\s*prospective lottery agents\.\s*</p>',
              '<p>Review applications, verify applicant information, manage approval decisions and track onboarding progress across the agent network.</p>',
              html,
              count=1,
              flags=re.S,
          )

          # -----------------------------------------------------
          # AGENT TAB: add live summary strip before filters.
          # -----------------------------------------------------
          if 'id="agent-tab-total"' not in html:
              tools_marker = '<div class="admin-tools">'
              summary = '''<div class="agent-network-summary" aria-label="Agent network summary">
                <article class="agent-summary-card">
                    <span>Active Applications</span>
                    <strong id="agent-tab-total">0</strong>
                    <small>Current non-archived records</small>
                </article>
                <article class="agent-summary-card pending">
                    <span>Pending Applications</span>
                    <strong id="agent-tab-pending">0</strong>
                    <small>Awaiting an application decision</small>
                </article>
                <article class="agent-summary-card approved">
                    <span>Approved Applications</span>
                    <strong id="agent-tab-approved">0</strong>
                    <small>Applications approved for onboarding</small>
                </article>
                <article class="agent-summary-card onboarded">
                    <span>Onboarded Agents</span>
                    <strong id="agent-tab-onboarded">0</strong>
                    <small>Approved agents already onboarded</small>
                </article>
            </div>


            '''
              agent_section_pos = html.find('id="agents-tab"')
              if agent_section_pos == -1:
                  raise SystemExit('Agents tab was not found.')
              tools_pos = html.find(tools_marker, agent_section_pos)
              if tools_pos == -1:
                  raise SystemExit('Agents filter toolbar was not found.')
              html = html[:tools_pos] + summary + html[tools_pos:]

          # -----------------------------------------------------
          # AGENT TAB: add separate onboarding filter.
          # -----------------------------------------------------
          if 'id="agent-onboarding-filter"' not in html:
              status_select_end = re.search(
                  r'(<div class="admin-form-group">\s*<label for="agent-status-filter">.*?</select>\s*</div>)',
                  html[html.find('id="agents-tab"'):],
                  flags=re.S,
              )
              if not status_select_end:
                  raise SystemExit('Application status filter block was not found.')
              block = status_select_end.group(1)
              onboarding_filter = '''

                <div class="admin-form-group">
                    <label for="agent-onboarding-filter">
                        Agent Status
                    </label>
                    <select id="agent-onboarding-filter">
                        <option value="all">All Agent Status</option>
                        <option value="pending">Pending Onboarding</option>
                        <option value="onboarded">Onboarded</option>
                    </select>
                </div>'''
              agent_start = html.find('id="agents-tab"')
              abs_start = agent_start + status_select_end.start(1)
              abs_end = agent_start + status_select_end.end(1)
              html = html[:abs_end] + onboarding_filter + html[abs_end:]

          # -----------------------------------------------------
          # JS: reference onboarding filter.
          # -----------------------------------------------------
          if 'const agentOnboardingFilter' not in js:
              marker = '''const agentStatusFilter =
    document.getElementById(
        "agent-status-filter"
    );'''
              replacement = marker + '''


const agentOnboardingFilter =
    document.getElementById(
        "agent-onboarding-filter"
    );'''
              if marker not in js:
                  raise SystemExit('agentStatusFilter reference was not found.')
              js = js.replace(marker, replacement, 1)

          # -----------------------------------------------------
          # JS: agent summary statistics.
          # -----------------------------------------------------
          if 'const onboarded =' not in js[js.find('function updateAgentStatistics'):js.find('// =========================================================\n// FILTER AGENTS')]:
              archived_marker = '''    const archived =
        allApplications.filter('''
              onboarded_block = '''    const onboarded =
        active.filter(
            item => String(item.onboarding_status || "pending").toLowerCase() === "onboarded"
        );


'''
              segment_start = js.find('function updateAgentStatistics')
              segment_end = js.find('// =========================================================\n// FILTER AGENTS', segment_start)
              segment = js[segment_start:segment_end]
              if archived_marker not in segment:
                  raise SystemExit('Archived calculation was not found in updateAgentStatistics.')
              segment = segment.replace(archived_marker, onboarded_block + archived_marker, 1)
              js = js[:segment_start] + segment + js[segment_end:]

          if 'agent-tab-onboarded' not in js[js.find('function updateAgentStatistics'):js.find('// =========================================================\n// FILTER AGENTS')]:
              insert_before = '''    if (applicationsCount) {'''
              tab_stats = '''    const tabTotal = document.getElementById("agent-tab-total");
    const tabPending = document.getElementById("agent-tab-pending");
    const tabApproved = document.getElementById("agent-tab-approved");
    const tabOnboarded = document.getElementById("agent-tab-onboarded");

    if (tabTotal) tabTotal.textContent = String(active.length);
    if (tabPending) tabPending.textContent = String(pending.length);
    if (tabApproved) tabApproved.textContent = String(approved.length);
    if (tabOnboarded) tabOnboarded.textContent = String(onboarded.length);


'''
              segment_start = js.find('function updateAgentStatistics')
              segment_end = js.find('// =========================================================\n// FILTER AGENTS', segment_start)
              segment = js[segment_start:segment_end]
              if insert_before not in segment:
                  raise SystemExit('applicationsCount block was not found.')
              segment = segment.replace(insert_before, tab_stats + insert_before, 1)
              js = js[:segment_start] + segment + js[segment_end:]

          # -----------------------------------------------------
          # JS: onboarding filter logic.
          # -----------------------------------------------------
          if 'const onboardingFilterValue' not in js[js.find('function filterApplications'):js.find('// =========================================================\n// RENDER APPLICATIONS')]:
              filter_marker = '''    const filtered =
        allApplications.filter('''
              onboarding_value = '''    const onboardingFilterValue =
        String(
            agentOnboardingFilter?.value
            ||
            "all"
        )
            .toLowerCase();


'''
              filter_start = js.find('function filterApplications')
              render_start = js.find('// =========================================================\n// RENDER APPLICATIONS', filter_start)
              segment = js[filter_start:render_start]
              if filter_marker not in segment:
                  raise SystemExit('Applications filter block was not found.')
              segment = segment.replace(filter_marker, onboarding_value + filter_marker, 1)

              return_marker = '''                return (

                    statusMatches

                    &&

                    searchMatches

                );'''
              return_replacement = '''                const onboardingStatus =
                    String(application.onboarding_status || "pending").toLowerCase();

                const onboardingMatches =
                    onboardingFilterValue === "all"
                    || onboardingStatus === onboardingFilterValue;

                return (
                    statusMatches
                    && searchMatches
                    && onboardingMatches
                );'''
              if return_marker not in segment:
                  raise SystemExit('filterApplications return block was not found.')
              segment = segment.replace(return_marker, return_replacement, 1)
              js = js[:filter_start] + segment + js[render_start:]

          # -----------------------------------------------------
          # JS: premium structured application cards.
          # -----------------------------------------------------
          render_start = js.find('function renderApplications')
          render_end = js.find('// =========================================================\n// OPEN AGENT MODAL', render_start)
          if render_start == -1 or render_end == -1:
              raise SystemExit('renderApplications boundaries were not found.')
          render_segment = js[render_start:render_end]

          # Add onboardingStatus declaration after archived declaration.
          if 'const onboardingStatus =' not in render_segment:
              archived_decl = '''            const archived =
                application.archived ===
                true;'''
              onboarding_decl = archived_decl + '''


            const onboardingStatus =
                String(application.onboarding_status || "pending").toLowerCase();'''
              if archived_decl not in render_segment:
                  raise SystemExit('Archived declaration not found in renderApplications.')
              render_segment = render_segment.replace(archived_decl, onboarding_decl, 1)

          # Add premium class names.
          render_segment = render_segment.replace(
              '''            card.className =
                "admin-card";''',
              '''            card.className = [
                "admin-card",
                "agent-application-card",
                `application-${archived ? "archived" : status}`,
                `onboarding-${onboardingStatus}`
            ].join(" ");''',
              1,
          )

          # Replace the card HTML template with a cleaner structured layout.
          template_pattern = re.compile(r'            card\.innerHTML = `.*?\n            `;', re.S)
          premium_template = '''            card.innerHTML = `
                <div class="agent-card-header">
                    <div class="agent-card-title">
                        <span class="agent-card-kicker">AGENT APPLICATION</span>
                        <h3>${escapeHTML(application.full_name)}</h3>
                        <span class="agent-card-location">${escapeHTML(application.city)}, ${escapeHTML(application.state)}</span>
                    </div>
                    <div class="agent-card-statuses">
                        <span class="application-status ${archived ? "status-archived" : `status-${escapeHTML(status)}`}">
                            ${archived ? "ARCHIVED" : escapeHTML(status.toUpperCase())}
                        </span>
                        <span class="agent-onboarding-badge onboarding-badge-${escapeHTML(onboardingStatus)}">
                            ${onboardingStatus === "onboarded" ? "ONBOARDED" : "PENDING ONBOARDING"}
                        </span>
                    </div>
                </div>

                <div class="agent-card-contact-grid">
                    <div class="agent-card-contact">
                        <span>Phone</span>
                        <strong>${escapeHTML(application.phone)}</strong>
                    </div>
                    <div class="agent-card-contact">
                        <span>Email</span>
                        <strong>${escapeHTML(application.email || "Not provided")}</strong>
                    </div>
                    <div class="agent-card-contact">
                        <span>Submitted</span>
                        <strong>${escapeHTML(formatDateTime(application.created_at))}</strong>
                    </div>
                </div>

                <div class="agent-card-footer">
                    <div class="agent-card-progress">
                        <span class="agent-progress-dot ${status === "approved" ? "complete" : ""}"></span>
                        <span>Application ${status === "approved" ? "approved" : status === "rejected" ? "rejected" : "under review"}</span>
                        <span class="agent-progress-line"></span>
                        <span class="agent-progress-dot ${onboardingStatus === "onboarded" ? "complete" : ""}"></span>
                        <span>${onboardingStatus === "onboarded" ? "Agent onboarded" : "Onboarding pending"}</span>
                    </div>

                    <div class="admin-actions agent-card-actions">
                        <button
                            type="button"
                            class="admin-dark-btn view-agent"
                            data-id="${application.id}"
                        >
                            View Details
                        </button>

                        ${archived ? `
                            <button
                                type="button"
                                class="admin-restore-btn restore-agent"
                                data-id="${application.id}"
                            >
                                Restore
                            </button>
                        ` : `
                            <button
                                type="button"
                                class="admin-archive-btn archive-agent"
                                data-id="${application.id}"
                            >
                                Archive
                            </button>
                        `}

                        <button
                            type="button"
                            class="admin-danger-btn delete-agent"
                            data-id="${escapeHTML(application.id)}"
                        >
                            Delete
                        </button>
                    </div>
                </div>
            `;'''
          render_segment, template_count = template_pattern.subn(premium_template, render_segment, count=1)
          if template_count != 1:
              raise SystemExit('Could not replace agent application card template.')

          js = js[:render_start] + render_segment + js[render_end:]

          # -----------------------------------------------------
          # JS: listen to the new onboarding filter.
          # -----------------------------------------------------
          if 'agentOnboardingFilter' in js and 'agentOnboardingFilter\n        ?.addEventListener' not in js:
              events_marker = '''    agentStatusFilter
        ?.addEventListener(
            "change",
            filterApplications
        );'''
              events_add = events_marker + '''


    agentOnboardingFilter
        ?.addEventListener(
            "change",
            filterApplications
        );'''
              if events_marker not in js:
                  raise SystemExit('agentStatusFilter event listener was not found.')
              js = js.replace(events_marker, events_add, 1)

          # -----------------------------------------------------
          # CSS: premium agent-management presentation.
          # -----------------------------------------------------
          agent_css = r'''

/* =========================================================
   PREMIUM AGENT MANAGEMENT — V4
========================================================= */
#agents-tab .admin-panel {
    overflow: visible;
}

#agents-tab .admin-panel-heading {
    max-width: 860px;
}

.agent-network-summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 18px;
}

.agent-summary-card {
    position: relative;
    overflow: hidden;
    min-height: 116px;
    padding: 18px;
    border: 1px solid #dce6ef;
    border-radius: 17px;
    background: linear-gradient(145deg, #ffffff, #f8fbff);
    box-shadow: 0 10px 24px rgba(18,42,70,.055);
}

.agent-summary-card::after {
    content: "";
    position: absolute;
    width: 82px;
    height: 82px;
    right: -42px;
    top: -42px;
    border-radius: 50%;
    background: rgba(37,99,235,.10);
}

.agent-summary-card.pending::after { background: rgba(245,158,11,.14); }
.agent-summary-card.approved::after { background: rgba(22,163,74,.13); }
.agent-summary-card.onboarded::after { background: rgba(13,139,79,.16); }

.agent-summary-card span,
.agent-summary-card small {
    display: block;
}

.agent-summary-card span {
    color: #5f7087;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .3px;
    text-transform: uppercase;
}

.agent-summary-card strong {
    display: block;
    margin: 9px 0 5px;
    color: #0a1b35;
    font-size: 28px;
    font-weight: 950;
}

.agent-summary-card small {
    color: #79889b;
    font-size: 11px;
    line-height: 1.4;
}

#agents-tab .admin-tools {
    grid-template-columns: 2fr 1fr 1fr !important;
    margin-bottom: 18px;
}

#agent-applications-container {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 15px !important;
}

.agent-application-card {
    display: flex;
    flex-direction: column;
    min-height: 340px;
    padding: 0 !important;
    border-radius: 20px !important;
    background: #fff !important;
}

.agent-application-card::before {
    width: 5px !important;
    background: linear-gradient(180deg,#1d6de0,#0d8b4f) !important;
}

.agent-application-card.application-approved::before {
    background: linear-gradient(180deg,#17a05d,#087944) !important;
}

.agent-application-card.application-pending::before {
    background: linear-gradient(180deg,#f3b72b,#d97706) !important;
}

.agent-application-card.application-rejected::before {
    background: linear-gradient(180deg,#ef4444,#b91c1c) !important;
}

.agent-application-card.application-archived::before {
    background: linear-gradient(180deg,#64748b,#334155) !important;
}

.agent-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding: 22px 22px 18px 25px;
    border-bottom: 1px solid #e8eef4;
    background: linear-gradient(145deg,#ffffff,#f8fbfe);
}

.agent-card-title {
    min-width: 0;
}

.agent-card-kicker {
    display: block;
    margin-bottom: 5px;
    color: #0d8b4f;
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.25px;
}

.agent-card-title h3 {
    margin: 0 0 5px !important;
    color: #091a31 !important;
    font-size: 20px !important;
    font-weight: 950 !important;
    letter-spacing: -.35px;
}

.agent-card-location {
    color: #718197;
    font-size: 12px;
    font-weight: 750;
}

.agent-card-statuses {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    flex: 0 0 auto;
}

.agent-card-statuses .application-status {
    margin: 0 !important;
}

.agent-onboarding-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    padding: 5px 9px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 950;
    letter-spacing: .35px;
}

.onboarding-badge-pending {
    color: #9a5a07;
    background: #fff7dc;
    border-color: #f9df94;
}

.onboarding-badge-onboarded {
    color: #08733f;
    background: #e4f9ed;
    border-color: #bcebcf;
}

.agent-card-contact-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    padding: 18px 22px 4px 25px;
}

.agent-card-contact {
    min-width: 0;
    padding: 12px;
    border: 1px solid #e1e9f1;
    border-radius: 12px;
    background: #f9fbfd;
}

.agent-card-contact span,
.agent-card-contact strong {
    display: block;
}

.agent-card-contact span {
    margin-bottom: 5px;
    color: #7b899b;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .55px;
    text-transform: uppercase;
}

.agent-card-contact strong {
    overflow: hidden;
    color: #24384f;
    font-size: 12px;
    font-weight: 850;
    line-height: 1.4;
    text-overflow: ellipsis;
}

.agent-card-footer {
    margin-top: auto;
    padding: 16px 22px 20px 25px;
}

.agent-card-progress {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 9px 11px;
    border: 1px solid #e2eaf2;
    border-radius: 11px;
    background: linear-gradient(145deg,#f8fbfd,#fff);
    color: #66768b;
    font-size: 10px;
    font-weight: 800;
}

.agent-progress-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #c4cfdb;
    box-shadow: 0 0 0 3px rgba(148,163,184,.12);
}

.agent-progress-dot.complete {
    background: #16a05d;
    box-shadow: 0 0 0 3px rgba(22,160,93,.14);
}

.agent-progress-line {
    width: 20px;
    height: 1px;
    flex: 0 0 auto;
    background: #ced8e2;
}

.agent-card-actions {
    margin-top: 13px !important;
    padding-top: 13px;
    border-top: 1px solid #edf1f5;
}

.agent-card-actions .view-agent {
    min-width: 120px;
}

#agents-tab .admin-empty,
#agents-tab .admin-loading,
#agents-tab .admin-error-message {
    grid-column: 1 / -1;
}

/* Agent detail modal polish */
.agent-onboarding-status-panel {
    position: relative;
    overflow: hidden;
    padding: 20px !important;
}

.agent-onboarding-status-panel::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg,#0d8b4f,#2563eb);
}

.agent-onboarding-options {
    display: grid !important;
    grid-template-columns: repeat(2,minmax(0,1fr));
}

.agent-onboarding-option {
    min-height: 48px;
    justify-content: flex-start;
}

@media (max-width: 1000px) {
    .agent-network-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    #agents-tab .admin-tools {
        grid-template-columns: 1fr 1fr !important;
    }
    #agents-tab .admin-tools .admin-form-group:first-child {
        grid-column: 1 / -1;
    }
}

@media (max-width: 760px) {
    .agent-network-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }
    .agent-summary-card {
        min-height: 106px;
        padding: 14px;
    }
    .agent-summary-card strong {
        font-size: 25px;
    }
    #agents-tab .admin-tools {
        grid-template-columns: 1fr !important;
    }
    #agents-tab .admin-tools .admin-form-group:first-child {
        grid-column: auto;
    }
    #agent-applications-container {
        grid-template-columns: 1fr !important;
    }
    .agent-card-header {
        padding: 18px 16px 15px 19px;
    }
    .agent-card-title h3 {
        font-size: 18px !important;
    }
    .agent-card-contact-grid {
        grid-template-columns: 1fr 1fr;
        padding: 15px 16px 3px 19px;
    }
    .agent-card-contact:last-child {
        grid-column: 1 / -1;
    }
    .agent-card-footer {
        padding: 14px 16px 18px 19px;
    }
    .agent-card-progress {
        flex-wrap: wrap;
    }
}

@media (max-width: 460px) {
    .agent-card-header {
        flex-direction: column;
        gap: 11px;
    }
    .agent-card-statuses {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
    }
    .agent-card-contact-grid {
        grid-template-columns: 1fr;
    }
    .agent-card-contact:last-child {
        grid-column: auto;
    }
    .agent-card-actions {
        display: grid !important;
        grid-template-columns: 1fr;
    }
    .agent-card-actions button {
        width: 100%;
    }
}
'''

          if 'PREMIUM AGENT MANAGEMENT — V4' not in css:
              css += agent_css

          # -----------------------------------------------------
          # Cache busting.
          # -----------------------------------------------------
          html = re.sub(r'admin-premium-v3\.css\?v=\d+', 'admin-premium-v3.css?v=5', html, count=1)
          html = re.sub(r'admin\.js\?v=\d+', 'admin.js?v=1410', html, count=1)

          html_path.write_text(html, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate agent tab upgrade
        shell: bash
        run: |
          ! grep -q 'class="admin-view-site-btn"' admin.html
          grep -q 'id="agent-onboarding-filter"' admin.html
          grep -q 'id="agent-tab-onboarded"' admin.html
          grep -q 'agent-application-card' admin.js
          grep -q 'agentOnboardingFilter' admin.js
          grep -q 'PREMIUM AGENT MANAGEMENT — V4' admin-premium-v3.css

      - name: Commit agent management polish
        shell: bash
        run: |
          if git diff --quiet -- admin.html admin.js admin-premium-v3.css; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin.js admin-premium-v3.css
          git commit -m "ui: polish agent management and remove view website button"
          git push
