name: Standardize compact mobile navigation across public pages

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-public-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load shared compact mobile navigation last on all public pages
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'index.html',
              'results.html',
              'predictions.html',
              'play-online.html',
              'agent.html',
              'contact.html',
          ]

          link = '    <link rel="stylesheet" href="public-mobile-nav-compact-v8.css?v=8">\n'
          changed = []

          for filename in pages:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing expected public page: {filename}')

              html = path.read_text(encoding='utf-8')
              original = html

              html = re.sub(
                  r'\s*<link\s+rel="stylesheet"\s+href="public-mobile-nav-compact-v8\.css(?:\?v=\d+)?"\s*>\s*',
                  '\n',
                  html,
                  flags=re.I,
              )

              if '</head>' not in html:
                  raise SystemExit(f'No closing head tag in {filename}')

              html = html.replace('</head>', link + '</head>', 1)

              if html.rfind('public-mobile-nav-compact-v8.css?v=8') > html.find('</head>'):
                  raise SystemExit(f'Compact mobile nav link order failed in {filename}')

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(filename)

          if len(changed) != len(pages):
              print('Changed pages:', ', '.join(changed))

      - name: Commit shared compact mobile navigation
        shell: bash
        run: |
          if git diff --quiet -- index.html results.html predictions.html play-online.html agent.html contact.html; then
            echo "No public-page navigation changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: use compact two-column mobile navigation across public pages"
          git push
