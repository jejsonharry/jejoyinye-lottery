name: Load homepage mobile navigation override last

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-home-nav-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure homepage-only nav override loads after global mobile nav
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Remove any prior homepage-only override references.
          html = re.sub(
              r'\s*<link\s+rel="stylesheet"\s+href="homepage-mobile-nav-v7\.css(?:\?v=\d+)?"\s*>',
              '',
              html,
              flags=re.I,
          )

          global_link = '<link rel="stylesheet" href="public-nav-mobile-fit-v2.css?v=5">'
          if global_link not in html:
              raise SystemExit('Global mobile navigation stylesheet link not found.')

          html = html.replace(
              global_link,
              global_link + '\n    <link rel="stylesheet" href="homepage-mobile-nav-v7.css?v=7">',
              1,
          )

          if html.find('homepage-mobile-nav-v7.css?v=7') < html.find('public-nav-mobile-fit-v2.css?v=5'):
              raise SystemExit('Homepage override is not loading after global mobile nav.')

          path.write_text(html, encoding='utf-8')

      - name: Commit final homepage nav loading order
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: make two-column sticky homepage mobile nav take precedence"
          git push
