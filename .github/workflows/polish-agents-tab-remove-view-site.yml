name: Make only homepage mobile navigation sticky

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home-only-sticky-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark homepage and refresh reference mobile nav stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'index.html',
              'results.html',
              'predictions.html',
              'play-online.html',
              'agent.html',
              'contact.html',
          ]

          for filename in pages:
              path = Path(filename)
              html = path.read_text(encoding='utf-8')

              html = re.sub(
                  r'public-mobile-nav-reference-v9\.css\?v=\d+',
                  'public-mobile-nav-reference-v9.css?v=10',
                  html,
              )

              if filename == 'index.html':
                  if '<body class="home-page">' not in html:
                      html = re.sub(
                          r'<body(?:\s+class="([^"]*)")?\s*>',
                          lambda m: '<body class="' + ((m.group(1) + ' ') if m.group(1) else '') + 'home-page">',
                          html,
                          count=1,
                      )
              else:
                  html = html.replace(' home-page', '').replace('home-page ', '')
                  html = html.replace('class="home-page"', '')

              path.write_text(html, encoding='utf-8')

          index_html = Path('index.html').read_text(encoding='utf-8')
          if '<body class="home-page">' not in index_html:
              raise SystemExit('Homepage body class was not applied.')

          for filename in pages:
              html = Path(filename).read_text(encoding='utf-8')
              if 'public-mobile-nav-reference-v9.css?v=10' not in html:
                  raise SystemExit(f'New stylesheet version missing in {filename}')

      - name: Commit home-only sticky navigation behavior
        shell: bash
        run: |
          if git diff --quiet -- index.html results.html predictions.html play-online.html agent.html contact.html; then
            echo "No navigation changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: keep approved nav size and make only home sticky"
          git push
