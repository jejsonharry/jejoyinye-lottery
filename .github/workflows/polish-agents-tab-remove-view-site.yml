name: Remove homepage quick stats section

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-quick-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove four-card quick stats block from homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'<!-- =====================================================\s*QUICK STATS\s*===================================================== -->\s*<section class="quick-stats">.*?</section>\s*',
              re.S,
          )

          html, count = pattern.subn('', html, count=1)
          if count != 1:
              raise SystemExit('Quick stats section was not found exactly once.')

          forbidden = [
              'Modern Billionaire\n            Daily Games',
              'Ghana\n            Weekly Games',
              'Result\n            Updates',
              'Statistical\n            Insights',
          ]
          if any(text in html for text in forbidden):
              raise SystemExit('Quick stats content still remains after removal.')

          path.write_text(html, encoding='utf-8')

      - name: Commit homepage cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: remove homepage quick stats cards"
          git push
