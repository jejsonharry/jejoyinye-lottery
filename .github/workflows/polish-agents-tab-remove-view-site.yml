name: Move live updates to draw schedule position

on:
  push:
    paths:
      - '.github/workflows/polish-agents-tab-remove-view-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove draw schedule and move live results
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          draw_pattern = re.compile(
              r'<!-- =====================================================\s*TODAY\'S DRAW SCHEDULE\s*===================================================== -->.*?</section>\s*',
              re.S,
          )
          html, draw_count = draw_pattern.subn('', html, count=1)
          if draw_count != 1:
              raise SystemExit('Draw schedule section was not found exactly once.')

          results_pattern = re.compile(
              r'(<!-- =====================================================\s*LATEST LOTTERY RESULTS\s*===================================================== -->\s*<section\s+class="\s*home-results-section\s*premium-section\s*"\s*>.*?</section>)',
              re.S,
          )
          match = results_pattern.search(html)
          if not match:
              raise SystemExit('Latest Lottery Results section was not found.')

          results_section = match.group(1)
          html = html[:match.start()] + html[match.end():]

          quick_stats_end = html.find('</section>', html.find('class="quick-stats"'))
          if quick_stats_end == -1:
              raise SystemExit('Quick stats section was not found.')
          insert_at = quick_stats_end + len('</section>')

          html = html[:insert_at] + '\n\n\n' + results_section + '\n' + html[insert_at:]

          if 'TODAY\'S DRAW SCHEDULE' in html or 'Today’s Draw Schedule' in html:
              raise SystemExit('Draw schedule content still exists after update.')

          if html.find('LIVE UPDATES') > html.find('ONLINE PLAYER PROMOTION'):
              raise SystemExit('Live Updates was not moved above Online Player Promotion.')

          path.write_text(html, encoding='utf-8')

      - name: Commit homepage layout update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: replace draw schedule with live updates on homepage"
          git push
