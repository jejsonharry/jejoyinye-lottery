name: Remove prediction notes

on:
  push:
    paths:
      - 'scripts/remove-prediction-notes.py'
      - '.github/workflows/remove-prediction-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove prediction notes
        run: python scripts/remove-prediction-notes.py
      - name: Commit changes
        run: |
          if git diff --quiet -- predictions.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.html
          git commit -m "ui: remove prediction explanatory notes"
          git push
