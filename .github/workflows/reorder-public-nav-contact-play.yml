name: Reorder public nav contact and play

on:
  push:
    paths:
      - 'scripts/reorder-public-nav-contact-play.py'
      - '.github/workflows/reorder-public-nav-contact-play.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorder public navigation
        run: python scripts/reorder-public-nav-contact-play.py
      - name: Validate navigation order
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['index.html','results.html','predictions.html','play-online.html','agent.html','contact.html']
          wanted = ['href="/"','href="results"','href="predictions"','href="contact"','href="agent"','href="play-online"']
          for page in pages:
              text = Path(page).read_text(encoding='utf-8')
              start = text.index('<nav class="premium-nav">')
              end = text.index('</nav>', start)
              nav = text[start:end]
              positions = [nav.index(x) for x in wanted]
              if positions != sorted(positions):
                  raise SystemExit(f'Incorrect nav order in {page}: {positions}')
              print(f'validated {page}')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html results.html predictions.html play-online.html agent.html contact.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html results.html predictions.html play-online.html agent.html contact.html
          git commit -m "ui: swap Contact and Play Online navigation positions"
          git push
