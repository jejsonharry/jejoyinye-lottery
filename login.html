<!DOCTYPE html>
<html lang="en">

<head>
<link rel="apple-touch-icon" href="/Images/jols-logo.png?v=2">
<meta name="apple-mobile-web-app-title" content="JOLS Lottery">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Jejoyinye Lottery Services
    </title>


    <link
        rel="stylesheet"
        href="style.css?v=95"
    >
    <link rel="icon" href="Images/jols-logo.png" type="image/png">


    <!-- SUPABASE LIBRARY -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- YOUR SUPABASE CONNECTION -->

    <script
        src="supabase.js"
    ></script>


    <!-- LOGIN CODE -->

    <script
        src="login.js"
        defer
    ></script>

  <meta name="robots" content="noindex, nofollow">
</head>


<body>


<header>

    <div class="logo-section">

        <img
            src="Images/jols-logo.png"
            alt="Jejoyinye Lottery Services logo"
            class="logo"
        >


        <div>

            <h1>
                JEJOYINYE LOTTERY SERVICES
            </h1>

            <p>
                Administrator Login
            </p>

        </div>

    </div>

</header>


<section class="login-section">

    <div class="login-box">

        <h2>
            Admin Login
        </h2>


        <p>
            Sign in with your administrator
            email and password.
        </p>


        <form id="login-form">


            <div class="form-group">

                <label for="admin-email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="admin-password">
                    Password
                </label>


                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="login-btn"
            >
                Login
            </button>


        </form>


        <p class="forgot-password-link">
            <a href="forgot-password">
                Forgot your password?
            </a>
        </p>


        <div id="login-message"></div>


    </div>

</section>


</body>

</html>
