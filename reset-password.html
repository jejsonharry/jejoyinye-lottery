<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Jejoyinye Lottery Services
    </title>

    <link
        rel="stylesheet"
        href="style.css?v=95"
    >
    <link rel="icon" href="Images/jols-logo.png" type="image/png">

    <!-- SUPABASE LIBRARY -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <!-- SUPABASE CONNECTION -->
    <script src="supabase.js"></script>

    <!-- PASSWORD RESET CODE -->
    <script
        src="reset-password.js"
        defer
    ></script>

  <meta name="robots" content="noindex, nofollow">
</head>


<body>

<header>

    <div class="logo-section">

        <img
            src="Images/jols-logo.png"
            alt="Jejoyinye Lottery Services logo"
            class="logo"
        >

        <div>

            <h1>
                JEJOYINYE LOTTERY SERVICES
            </h1>

            <p>
                Administrator Security
            </p>

        </div>

    </div>

</header>


<section class="login-section">

    <div class="login-box">

        <h2>
            Create New Password
        </h2>

        <p>
            Enter a new password for your
            administrator account.
        </p>


        <form id="reset-password-form">


            <div class="form-group">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm-password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Enter password again"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="update-password-btn"
            >
                Update Password
            </button>


        </form>


        <div id="password-message"></div>


        <p style="margin-top: 20px; text-align: center;">

            <a href="login">
                Return to Login
            </a>

        </p>

    </div>

</section>


</body>

</html>
